# HIS 收费流水对账契约
# 维护人：财务科对账岗（口径）+ 信息科接口岗（只读库取数）
# 硬约束：HIS 账号必须只读；本系统不写 HIS 账
name: HIS收费流水对账契约
version: "1.0"
channel: his
description: HIS 收费流水（只读库）的对账口径；退费红冲单列

variables:
  period: "2026-W36"
  session_timezone: "Asia/Shanghai"

dataset:
  name: HIS收费流水
  tables:
    - name: his_charge_record
      location: db:HIS_DB_DSN
      description: HIS 收费记录表（只读账号；取数按账期时间窗分批流式）
      columns:
        - name: his_order_no
          data_type: string
          description: HIS 收费记录主键（对齐渠道商户订单号）
          required: true
          checks:
            - name: 收费记录主键唯一
              path: [his_order_no, unique]
              type: unique
        - name: charge_id
          data_type: string
          description: 收费流水内部主键
          required: true
        - name: amount
          data_type: decimal
          description: 收费金额（元）
          required: true
          checks:
            - name: 金额两位小数
              path: [amount, scale]
              type: decimal_scale
              scale: 2
        - name: charge_time
          data_type: datetime
          description: 收费时间（库时区）
          required: true
        - name: period_code
          data_type: string
          description: 账期（如 2026-W36）
          required: true
          checks:
            - name: 账期须与本次扫描账期一致
              path: [period_code, equal]
              type: column_equality
              compare_column: period_code
              compare_value: ${period}
        - name: department
          data_type: string
          description: 收费科室
          required: true
          checks:
            - name: 收费科室必填
              path: [department, not_empty]
              type: not_empty
            - name: 收费科室须落在本院科室清单内
              path: [department, in_department_list]
              type: set_contains
              # 科室取值必须来自本院科室清单。清单由信息科按院内组织架构维护，
              # 换人换科室时改这一处即可，不需要改代码。样例账单只用到其中
              # 几个代表科室；院方上线前须替换为本院完整清单。
              values: [门诊, 急诊, 住院, 儿科, 检验科, 影像科, 药剂科, 财务科, 医保办, 信息科]
        - name: settle_type
          data_type: string
          description: 结算方式
          required: true
          checks:
            - name: 结算方式枚举
              path: [settle_type, in_enum]
              type: in_enum
              values: [微信, 支付宝, 银联, 自助机, 医保, 现金, 银行卡, 银行转账]
        - name: is_refund
          data_type: boolean
          description: 是否红冲退费
          required: false
      checks:
        - name: 收费笔数不为零
          path: [rows, row_count]
          type: row_count
          min: 1
        - name: 退费红冲笔数单列
          path: [rows, refund_count]
          type: row_count
          where: {is_refund: true}

# dataset 级对账口径
checks:
  - name: 收费金额合计（作为渠道侧的对照基准）
    path: [rows, amount_sum, baseline]
    type: decimal_sum
    column: amount
    exclude_where: {is_refund: true}
    tolerance: "0.01"
  - name: 红冲退费金额单列
    path: [rows, refund_sum]
    type: decimal_sum
    column: amount
    where: {is_refund: true}
  - name: 跨日切分：收费时间须落在账期窗口内
    path: [rows, charge_time, in_period]
    type: cross_period
    column: charge_time
    period_variable: period
    timezone_variable: session_timezone
  - name: 退费红冲：红冲行须与同单号正向收费行成对
    path: [rows, is_refund, offset]
    type: refund_offset
    column: amount
    where: {is_refund: true}
    pair_column: his_order_no
