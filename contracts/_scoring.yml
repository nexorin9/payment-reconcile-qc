# 弱匹配二级候选打分配置
#
# 维护人：财务科对账岗（口径）· 信息科接口岗（字段可得性）
#
# 这份配置决定「单号对不上时，哪一条 HIS 记录先给经办人看」。
# 改这里的任何一项都会改变候选排序与分档，因此：
#   1. 改动必须与 contracts/<channel>.yml 的口径变更同批次提交；
#   2. 扫描时会比对配置指纹，指纹变化会写进事件链（见 progress / 结论单），
#      「上周那条是强候选、这周同样的数据成了弱候选」必须当场答得出原因。
#
# 重要口径（三档都**不自动认领**）：
#   strong   = 金额绝对相等 + 时间在窗内 + 加权分达 strong_min
#   weak     = 部分因子满足（金额对但科室不符、或者只有金额对得上之类）
#   unusable = 加权分低于 weak_min，通常是金额就超了容差
#   分档只决定「先看哪一条」，不决定「这条就是它」。

name: 弱匹配二级候选打分配置
version: "1.0"
description: 渠道行单号未命中时，按四因子给 HIS 侧候选打分并分三档

tolerance:
  # 金额容差（元，Decimal 定点，禁浮点）
  # 院内导出常把分位抹零（收 100 记 99.99），差 0.01 元在业务上仍算「钱对得上」；
  # 差 0.02 元多半是某一边漏了一笔费用项目，不该被抹平。
  amount: "0.01"
  # 时间窗距离（分钟）：超过这个距离记 0 分。
  # 默认 1440 = 24 小时，对应「同一天内的一笔缴费」。
  time_window_minutes: 1440

weights:
  # 四个因子权重之和不必等于 1，分数按**可用**因子归一后取 0–1。
  # 某因子两侧任一为空即**不可用**：既不加分也不扣分，且不进分母。
  # （渠道账单导出普遍没有科室列；把它记成「不一致」会让文件通道的候选凭空掉分）
  amount: "0.45"
  time: "0.25"
  department: "0.15"
  settle_type: "0.15"
  # 跨渠道互相印证：同一金额在另一路渠道也出现、且那一路同样无 HIS 对应。
  # 这是**合并支付的线索**，不是证据 —— 因此权重刻意压低，且单独不足以
  # 把候选抬进 strong（strong 另需金额绝对相等 + 时间在窗内两条硬判据）。
  cross_channel: "0.10"

tiers:
  # 加权分 ≥ strong_min 且满足两条硬判据 → strong
  strong_min: "0.85"
  # 加权分 ≥ weak_min → weak；低于 → unusable
  weak_min: "0.40"

candidates:
  # 台账与面板的展示上限（不是判定上限）。
  # 全部候选可用 reconq align expand 查看 —— 截掉的第 6 条里完全可能有强候选。
  max_per_row: 5
