# 坏契约 1：悬空列引用
# decimal_sum 与 where 条件都指向了 dataset 里没有声明的列
name: 悬空列引用坏契约
version: "0.1"
channel: broken_dangling

variables:
  period: "2026-W36"

dataset:
  name: 坏账单表
  tables:
    - name: broken_bill
      location: inbox/${period}/broken_dangling/
      columns:
        - name: out_trade_no
          data_type: string
          required: true
          checks:
            - name: 订单号必填
              path: [out_trade_no, not_empty]
              type: not_empty
        - name: amount
          data_type: decimal
          required: true
          checks:
            - name: 金额两位小数
              path: [amount, scale]
              type: decimal_scale
              scale: 2
      checks:
        - name: 笔数不为零
          path: [rows, row_count]
          type: row_count
          min: 1

checks:
  - name: 金额合计与 HIS 对照
    path: [rows, amount_sum, compare_his]
    type: decimal_sum
    # amt 是拼错的列名：dataset 里只声明了 amount
    column: amt
  - name: 成功交易合计
    path: [rows, success_amount_sum]
    type: decimal_sum
    column: amount
    # trade_stauts 是拼错的列名：dataset 里只声明了 out_trade_no / amount
    where: {trade_stauts: SUCCESS}
