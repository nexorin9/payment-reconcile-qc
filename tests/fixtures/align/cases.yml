    channel: alipay
    note: 拆成三笔且金额全同：扇出侧全同只在**不守恒**时才判信息耗尽，守恒优先判拆笔
    channel_rows:
      - {order_no: ACP-03, amount: "300.00", trade_time: "2026-09-02T10:00:00+08:00", source_row_no: 4}
    his_rows:
