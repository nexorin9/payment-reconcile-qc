# 对齐黄金样例回归集（reconq align-golden 的唯一真源）
#
# 这份文件与 tests/fixtures/align/golden.jsonl（Task 38 的指标金标集）**分工不同**，
# 不要合并：
#   * golden.jsonl 回答「本产品比基础方案准不准」——条数越多指标越可信，衡量的是
#     召回 / 误报 / 形态命中率；
#   * cases.yml 回答「改了这版代码，有没有把原来对的东西改坏」——它按**形态**
#     组织（每种形态必须留够样本），并对每条 case 钉死**证据行号**。
#     指标集里一条 matched case 错了只掉 1% 召回；这里一条四形态 case 错了，
#     现场就是「一类差异整体判错方向」。
#
# 登记规范（新增边界形态必须先改这里，再改代码）
# ----------------------------------------------------
# 发现一个新的边界形态时，**先**在 cases.yml 里加 case（哪怕先把 expect 写成
# 现状、标 note 说明它是错的），跑一次 align-golden 让它红，再改
# src/reconq/align/matcher.py / ambiguity.py 让它绿。顺序反过来就会出现
# 「代码已经按新形态写了、例子里却一条都没有」——那种改动下次重构就被无声抹掉。
# form 标签是受控词表（reconq.align.cases.CASE_FORMS），写错会在加载期报
# ALIGN_CASE_FORM_UNKNOWN 并列出全部合法标签，不会被当成新形态静默接受。
#
# 脱敏口径
# --------
# 单号一律 AC-/ACS-/ACP-/ACR-/ACK-/ACD- 前缀占位，与 2026-W36 样例账单
# （EX-*、WXTXN-*）无交集；金额为占位金额，两位小数，不映射任何真实收费项目；
# 科室只取门诊收费室 / 住院收费室 / 急诊收费室三个通用称呼；**不含任何患者
# 可识别明细**。
#
# 字段说明
# --------
#   case_id        唯一标识，报告与失败信息按它定位
#   form           形态标签（受控词表，见文件末尾 form_counts 说明）
#   channel        该 case 跑在哪一路渠道上
#   focus_index    取哪一行渠道行的结论去比对（默认最后一行）
#   expect.status  期望的 MatchStatus（见 reconq.align.matcher.MatchStatus）
#   expect.kind    期望的歧义分类（reconq.align.ambiguity.AmbiguityKind，
#                  非歧义结论写 ""）
#   expect.taxonomy_kind
#                  期望的成因分类（reconq.align.taxonomy.AmbiguityKind）。
#                  **只对四种歧义形态必填** —— 其余形态不写（分类层对它们
#                  本来就不判成因）。
#   expect.evidence_rows
#                  期望出现在结论里的证据行号集合（排序去重后比对）
#   expect.diff_amount  期望差额（仅 status=mismatch 时填）
#   expect.his_only_rows
#                  期望的「HIS 有渠道无」行号集合

set_version: align-cases-v1
period: 2026-W36
meta:
  annotated_source: >-
    本轮（round_089）由项目侧人工逐条标注：每条 case 的期望结论按
    reconq.align.matcher 的判定顺序与 reconq.align.ambiguity /
    reconq.align.taxonomy 的判据硬边界逐条推演写出，并按 2026-W36 账期窗口
    （2026-08-31 00:00 → 2026-09-07 00:00，Asia/Shanghai，半开）核对时刻落点。
  annotated_at: "2026-09-30"
  annotator_role: 财务科对账岗（业务口径） + 信息科接口岗（取数与账期口径）联合标注
  amounts: 全部为脱敏占位金额，人民币元两位小数，不映射到任何真实收费项目
  order_nos: 全部为 AC- 前缀占位单号，与 2026-W36 样例账单（EX-*/WXTXN-*）无交集
  boundary_notes:
    - "账期窗口半开 [08-31 00:00, 09-07 00:00)：恰好落在 09-07 00:00:00 的记录属下一期（ACP-05X），恰好落在 08-31 00:00:00 的记录属本期（ACP-06X）。"
    - "ACP-03X / ACP-04X 两组候选全部越界：ACP-03X 金额不同仍先判跨账期，ACP-04X 金额相同也**不**先判金额相同 —— 跨账期判据比金额硬。"
    - "ACR-03 与 ACR-06 是一对镜像：前者的原单在**渠道侧**（43.00 非退费行）故判退费并存，后者的渠道行本身也是退费行、根本没有原单，故**不**判并存。「并存」看的是全部参与判别的行，只看 HIS 侧会把两者判成同一种。"
    - "ACK-07 唯一候选已被前一行的精确匹配认领：弱匹配**不退回全集**，否则第二行会把别人认领过的记录再弱匹配一次，看着两行都有候选、实则重复计入。"
    - "ACK-08 两行渠道款弱匹配到同一条 HIS 收费：弱匹配从不认领，两行都报待人工，结论是「这一条没对上」而不是「候选冲突」。"
    - "ACD-04 同一单号两条完全相同的 HIS 记录：判 equal_amount（信息耗尽），不是 refund_coexist 也不是 split。"

cases:
  # ═══════════════ 一、single（10 条）：一对一或明确单边 ═══════════════
  - case_id: ACS-01
    form: single
    channel: wechat
    note: 单号精确命中唯一一条 HIS 记录且金额一致 —— 干净对齐
    channel_rows:
      - {order_no: ACS-01, amount: "128.00", trade_time: "2026-09-02T10:05:00+08:00", trade_type: SUCCESS, source_row_no: 2}
    his_rows:
      - {order_no: ACS-01, amount: "128.00", trade_time: "2026-09-02T10:06:00+08:00", ch_id: 910101, department: 门诊收费室, settle_type: 微信, source_row_no: 11}
    expect: {status: matched, kind: "", evidence_rows: [11], his_only_rows: []}

  - case_id: ACS-02
    form: single
    channel: alipay
    note: 对上了但对不平 —— 差额必须报出来，这是比「对不上」更需要解释的一类
    channel_rows:
      - {order_no: ACS-02, amount: "128.00", trade_time: "2026-09-02T11:05:00+08:00", trade_type: SUCCESS, source_row_no: 3}
    his_rows:
      - {order_no: ACS-02, amount: "100.00", trade_time: "2026-09-02T11:06:00+08:00", ch_id: 910102, department: 门诊收费室, settle_type: 支付宝, source_row_no: 12}
    expect: {status: mismatch, kind: "", evidence_rows: [12], diff_amount: "28.00", his_only_rows: []}

  - case_id: ACS-03
    form: single
    channel: unionpay
    note: 渠道有 HIS 无；同一条 HIS 记录反过来也要报（HIS 有渠道无）
    channel_rows:
      - {order_no: ACS-03, amount: "66.00", trade_time: "2026-09-02T12:05:00+08:00", source_row_no: 4}
    his_rows:
      - {order_no: ACS-98, amount: "45.00", trade_time: "2026-09-02T12:06:00+08:00", ch_id: 910103, department: 急诊收费室, settle_type: 现金, source_row_no: 13}
    expect: {status: channel_only, kind: "", evidence_rows: [], his_only_rows: [13]}

  - case_id: ACS-04
    form: single
    channel: self_service
    note: 焦点行已对齐，但另有一条 HIS 收费无人认领 —— 反向单边账挂在 AlignAllResult 层
    channel_rows:
      - {order_no: ACS-04, amount: "88.00", trade_time: "2026-09-03T09:00:00+08:00", source_row_no: 5}
    his_rows:
      - {order_no: ACS-04, amount: "88.00", trade_time: "2026-09-03T09:01:00+08:00", ch_id: 910104, department: 门诊收费室, settle_type: 自助机, source_row_no: 14}
      - {order_no: ACS-04B, amount: "66.00", trade_time: "2026-09-03T09:05:00+08:00", ch_id: 910105, department: 门诊收费室, settle_type: 现金, source_row_no: 15}
    expect: {status: matched, kind: "", evidence_rows: [14], his_only_rows: [15]}

  - case_id: ACS-05
    form: single
    channel: wechat
    note: 渠道行内退费：退款额是正数，净收款 = 订单金额 − 退款额，与 HIS 侧净额对上
    channel_rows:
      - {order_no: ACS-05, amount: "128.00", refund: "86.00", trade_time: "2026-09-03T10:00:00+08:00", trade_type: REFUND, source_row_no: 6}
    his_rows:
      - {order_no: ACS-05, amount: "42.00", trade_time: "2026-09-03T10:02:00+08:00", ch_id: 910106, department: 门诊收费室, settle_type: 微信, source_row_no: 16}
    expect: {status: matched, kind: "", evidence_rows: [16], his_only_rows: []}

  - case_id: ACS-06
    form: single
    channel: wechat
    note: 同一笔被两行同号渠道行各报一次：只认领一次，第二行报重复认领而不是二次认领
    focus_index: 1
    channel_rows:
      - {order_no: ACS-06, amount: "128.00", trade_time: "2026-09-03T11:00:00+08:00", source_row_no: 7}
      - {order_no: ACS-06, amount: "128.00", trade_time: "2026-09-03T11:00:30+08:00", source_row_no: 8}
    his_rows:
      - {order_no: ACS-06, amount: "128.00", trade_time: "2026-09-03T11:01:00+08:00", ch_id: 910107, department: 门诊收费室, settle_type: 微信, source_row_no: 17}
    expect: {status: duplicate_claim, kind: duplicate_claim, evidence_rows: [17], his_only_rows: []}

  - case_id: ACS-07
    form: single
    channel: alipay
    note: 渠道行自带 his_order_no（院内导出填了）：按 HIS 单号对齐，渠道侧商户订单号与 HIS 侧不同名
    channel_rows:
      - {order_no: ACS-07A, his_order_no: ACS-07B, amount: "128.00", trade_time: "2026-09-03T14:00:00+08:00", source_row_no: 9}
    his_rows:
      - {order_no: ACS-07B, his_order_no: ACS-07B, amount: "128.00", trade_time: "2026-09-03T14:02:00+08:00", ch_id: 910108, department: 门诊收费室, settle_type: 支付宝, source_row_no: 18}
    expect: {status: matched, kind: "", evidence_rows: [18], his_only_rows: []}

  - case_id: ACS-08
    form: single
    channel: unionpay
    note: 容差边界：差额恰好 0.01 元按分位抹零容差判过（院内导出常有分位抹零）
    channel_rows:
      - {order_no: ACS-08, amount: "128.00", trade_time: "2026-09-04T09:00:00+08:00", source_row_no: 10}
    his_rows:
      - {order_no: ACS-08, amount: "128.01", trade_time: "2026-09-04T09:01:00+08:00", ch_id: 910109, department: 门诊收费室, settle_type: 银联, source_row_no: 19}
    expect: {status: matched, kind: "", evidence_rows: [19], his_only_rows: []}

  - case_id: ACS-09
    form: single
    channel: self_service
    note: 超出容差一个分位即报金额不符 —— 容差不是无限放大的橡皮
    channel_rows:
      - {order_no: ACS-09, amount: "128.00", trade_time: "2026-09-04T10:00:00+08:00", source_row_no: 11}
    his_rows:
      - {order_no: ACS-09, amount: "128.02", trade_time: "2026-09-04T10:01:00+08:00", ch_id: 910110, department: 门诊收费室, settle_type: 自助机, source_row_no: 20}
    expect: {status: mismatch, kind: "", evidence_rows: [20], diff_amount: "-0.02", his_only_rows: []}

  - case_id: ACS-10
    form: single
    channel: medical_ins
    note: 医保代收渠道的单边对齐：金额一致即已对齐，科室与结算方式不同不影响
    channel_rows:
      - {order_no: ACS-10, amount: "66.00", trade_time: "2026-09-04T14:00:00+08:00", source_row_no: 12}
    his_rows:
      - {order_no: ACS-10, amount: "66.00", trade_time: "2026-09-04T14:01:00+08:00", ch_id: 910111, department: 住院收费室, settle_type: 医保, source_row_no: 21}
    expect: {status: matched, kind: "", evidence_rows: [21], his_only_rows: []}

  # ═══════ 二、one_code_multi_settle（6 条）：一码付拆多笔，金额守恒 ═══════
  - case_id: ACP-01
    form: one_code_multi_settle
    channel: wechat
    note: 住院预交金按费用项目拆开入账：一条渠道单号 → 两条 HIS 收费，两侧金额守恒
    channel_rows:
      - {order_no: ACP-01, amount: "128.00", trade_time: "2026-09-02T09:00:00+08:00", source_row_no: 2}
    his_rows:
      - {order_no: ACP-01, amount: "66.00", trade_time: "2026-09-02T09:01:00+08:00", ch_id: 920101, department: 住院收费室, settle_type: 微信, source_row_no: 31}
      - {order_no: ACP-01, amount: "62.00", trade_time: "2026-09-02T09:01:30+08:00", ch_id: 920102, department: 住院收费室, settle_type: 微信, source_row_no: 32}
