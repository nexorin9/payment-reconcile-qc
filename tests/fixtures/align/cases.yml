    expect: {status: ambiguous, kind: split, taxonomy_kind: split_payment, evidence_rows: [46, 47], his_only_rows: []}

  # ═══════════ 三、merged（5 条）：多对一扇出且金额不守恒 ═══════════
  - case_id: ACM-01
    form: merged
    channel: wechat
    note: 家属一次刷卡付了多个单：渠道侧一笔 128.00，HIS 侧两条合计 156.00，不守恒
