  - case_id: ACP-02
    form: one_code_multi_settle
    channel: wechat
    note: 拆成三笔，其中两笔金额相同：金额全同的那部分不改变「守恒 ⇒ 拆笔」的结论
    channel_rows:
      - {order_no: ACP-02, amount: "128.00", trade_time: "2026-09-02T09:30:00+08:00", source_row_no: 3}
    his_rows:
      - {order_no: ACP-02, amount: "40.00", trade_time: "2026-09-02T09:31:00+08:00", ch_id: 920103, department: 住院收费室, settle_type: 微信, source_row_no: 33}
      - {order_no: ACP-02, amount: "40.00", trade_time: "2026-09-02T09:31:20+08:00", ch_id: 920104, department: 住院收费室, settle_type: 微信, source_row_no: 34}
      - {order_no: ACP-02, amount: "48.00", trade_time: "2026-09-02T09:31:40+08:00", ch_id: 920105, department: 住院收费室, settle_type: 微信, source_row_no: 35}
    expect: {status: ambiguous, kind: split, taxonomy_kind: split_payment, evidence_rows: [33, 34, 35], his_only_rows: []}

